<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NewsDesk</title>
  <style>
    :root {
      --bg: #0f0f1a;
      --surface: #1a1a2e;
      --surface2: #232342;
      --accent: #6366f1;
      --accent2: #8b5cf6;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #f59e0b;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
      --border: #2d2d5a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 420px;
      min-height: 520px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      padding: 0;
    }
    .header {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .header .badge { font-size: 11px; background: rgba(255,255,255,.2); padding: 2px 8px; border-radius: 10px; }

    .tab-bar { display: flex; border-bottom: 1px solid var(--border); background: var(--surface); }
    .tab {
      flex: 1; padding: 10px 0; text-align: center; font-size: 12px; font-weight: 600;
      cursor: pointer; color: var(--text-dim); border-bottom: 2px solid transparent; transition: all .15s;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .panel { display: none; padding: 12px; max-height: 520px; overflow-y: auto; }
    .panel.active { display: block; }

    .queue-item {
      background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
      padding: 12px; margin-bottom: 10px;
    }
    .queue-item .qi-title { font-weight: 600; font-size: 13px; margin-bottom: 6px; line-height: 1.4; }
    .queue-item .qi-meta { font-size: 11px; color: var(--text-dim); margin-bottom: 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
    .queue-item .qi-actions { display: flex; gap: 6px; margin-top: 8px; }
    .qi-actions button {
      flex: 1; padding: 7px 0; border: none; border-radius: 6px; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: opacity .15s;
    }
    .qi-actions button:hover { opacity: .8; }
    .btn-approve { background: var(--green); color: #fff; }
    .btn-reject  { background: var(--red);   color: #fff; }
    .btn-open    { background: var(--surface); color: var(--text); border: 1px solid var(--border) !important; }

    .tag {
      background: var(--surface); padding: 1px 6px; border-radius: 4px; font-size: 10px;
    }

    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat-card {
      background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
      padding: 14px; text-align: center;
    }
    .stat-card .num {
      font-size: 28px; font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .stat-card .label { font-size: 11px; color: var(--text-dim); margin-top: 4px; }

    .config-section {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px; margin-bottom: 10px;
    }
    .config-section h3 { font-size: 12px; font-weight: 700; margin-bottom: 8px; color: var(--accent); }
    .config-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 12px;
    }
    .config-row:last-child { border-bottom: none; }
    .config-row label { color: var(--text-dim); }
    .config-row input[type="text"],
    .config-row input[type="password"],
    .config-row select {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      border-radius: 4px; padding: 5px 8px; font-size: 12px; width: 160px;
    }
    .config-row input[type="password"] { font-family: monospace; }
    .config-full { flex-direction: column; align-items: stretch; gap: 4px; }
    .config-full input { width: 100% !important; }

    .toggle {
      position: relative; width: 36px; height: 20px; background: var(--border);
      border-radius: 10px; cursor: pointer; transition: background .2s;
    }
    .toggle.on { background: var(--accent); }
    .toggle::after {
      content: ""; position: absolute; top: 2px; left: 2px;
      width: 16px; height: 16px; background: #fff; border-radius: 50%; transition: transform .2s;
    }
    .toggle.on::after { transform: translateX(16px); }

    .refresh-btn, .action-btn {
      width: 100%; padding: 10px; border: none; border-radius: 8px;
      font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity .15s;
    }
    .refresh-btn {
      background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; margin-bottom: 10px;
    }
    .refresh-btn:hover { opacity: .85; }
    .action-btn { background: var(--surface2); color: var(--text); border: 1px solid var(--border); margin-top: 6px; }
    .action-btn:hover { background: var(--border); }

    .empty-state { text-align: center; padding: 32px 16px; color: var(--text-dim); font-size: 12px; }
    .empty-state .icon { font-size: 32px; margin-bottom: 8px; }

    .draft-editor { margin-top: 10px; }
    .draft-editor textarea {
      width: 100%; background: var(--surface); border: 1px solid var(--border);
      color: var(--text); border-radius: 6px; padding: 10px; font-size: 12px;
      resize: vertical; min-height: 80px; font-family: inherit; line-height: 1.5;
    }
    .draft-editor .plat-label { font-size: 11px; color: var(--accent); font-weight: 700; margin: 8px 0 4px; display: flex; align-items: center; gap: 4px; }

    /* 自定义滚动条 */
    .panel::-webkit-scrollbar { width: 6px; }
    .panel::-webkit-scrollbar-track { background: var(--bg); }
    .panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .panel::-webkit-scrollbar-thumb:hover { background: var(--accent); }
  </style>
</head>
<body>

<div class="header">
  <h1>📰 NewsDesk</h1>
  <span class="badge">v0.4.0 · 离线模式</span>
</div>

<div class="tab-bar">
  <div class="tab active" data-tab="queue">队列 <span id="queueCount">(0)</span></div>
  <div class="tab" data-tab="stats">统计</div>
  <div class="tab" data-tab="config">设置</div>
</div>

<!-- Queue Panel -->
<div class="panel active" id="panel-queue">
  <button class="refresh-btn" id="refreshBtn">🔄 抓取新闻</button>
  <div id="queueList">
    <div class="empty-state">
      <div class="icon">📭</div>
      <div>点击「抓取新闻」开始</div>
      <div style="margin-top:4px;font-size:11px;">数据存储在浏览器本地，关闭后仍保留</div>
    </div>
  </div>
</div>

<!-- Stats Panel -->
<div class="panel" id="panel-stats">
  <div class="stats-grid">
    <div class="stat-card"><div class="num" id="statPending">0</div><div class="label">待审核</div></div>
    <div class="stat-card"><div class="num" id="statApproved">0</div><div class="label">已批准</div></div>
    <div class="stat-card"><div class="num" id="statRejected">0</div><div class="label">已拒绝</div></div>
    <div class="stat-card"><div class="num" id="statTotal">0</div><div class="label">总计</div></div>
  </div>
  <button class="action-btn" id="clearAllBtn" style="margin-top:12px;">🗑️ 清空全部数据</button>
  <div style="margin-top:10px;padding:10px;background:var(--surface2);border-radius:8px;border:1px solid var(--border);font-size:11px;color:var(--text-dim);">
    <strong style="color:var(--text);">💡 提示</strong><br/>
    所有数据存储在浏览器本地（chrome.storage），无需联网或本地服务端。
  </div>
</div>

<!-- Config Panel -->
<div class="panel" id="panel-config">
  <div class="config-section">
    <h3>✍️ 文案风格</h3>
    <div class="config-row">
      <label>风格</label>
      <select id="cfgStyle">
        <option value="professional">分析师专业风</option>
        <option value="casual">口语化快评</option>
        <option value="emoji_heavy">Emoji 丰富风</option>
        <option value="minimal">极简短句</option>
        <option value="thread">X Thread 深度</option>
        <option value="newsletter">Newsletter 摘要</option>
        <option value="tech_deep">技术深度解读</option>
        <option value="quick_hit">快讯快评</option>
        <option value="story">叙事故事风</option>
        <option value="price_focus">价格聚焦风</option>
      </select>
    </div>
    <div class="config-row">
      <label>语言</label>
      <select id="cfgLang">
        <option value="zh">简体中文</option>
        <option value="en">English</option>
      </select>
    </div>
  </div>

  <div class="config-section">
    <h3>🤖 LLM 智能改写（可选）</h3>
    <div class="config-row">
      <label>启用 LLM 生成</label>
      <input type="checkbox" id="cfgLLMEnabled" />
    </div>
    <div class="config-row">
      <label>服务商</label>
      <select id="cfgLLMProvider">
        <option value="openai">OpenAI</option>
        <option value="anthropic">Anthropic</option>
        <option value="deepseek">DeepSeek</option>
        <option value="qwen">通义千问</option>
        <option value="custom">自定义</option>
      </select>
    </div>
    <div class="config-row config-full">
      <label style="margin-bottom:4px;">API Key</label>
      <input type="password" id="cfgLLMKey" placeholder="sk-..." />
    </div>
    <div class="config-row config-full">
      <label style="margin-bottom:4px;">API Base URL（可选）</label>
      <input type="text" id="cfgLLMBase" placeholder="https://api.openai.com/v1" />
    </div>
    <div class="config-row config-full">
      <label style="margin-bottom:4px;">模型名称</label>
      <input type="text" id="cfgLLMModel" placeholder="gpt-3.5-turbo" />
    </div>
    <div style="margin-top:6px;font-size:10px;color:var(--text-dim);">
      💡 未启用时使用本地模板生成，无需联网
    </div>
  </div>

  <div class="config-section">
    <h3>📡 推送平台</h3>
    <div class="config-row">
      <label>X / Twitter</label>
      <div class="toggle on" data-key="x"></div>
    </div>
    <div class="config-row">
      <label>Telegram</label>
      <div class="toggle on" data-key="telegram"></div>
    </div>
    <div class="config-row">
      <label>Discord</label>
      <div class="toggle on" data-key="discord"></div>
    </div>
  </div>

  <div class="config-section">
    <h3>⏰ 自动抓取</h3>
    <div class="config-row">
      <label>每 30 分钟自动抓取</label>
      <div class="toggle on" id="cfgAutoFetch"></div>
    </div>
    <div class="config-row">
      <label>桌面通知</label>
      <div class="toggle on" id="cfgNotif"></div>
    </div>
  </div>

  <button class="refresh-btn" id="saveCfgBtn" style="margin-top:0;">💾 保存设置</button>
</div>

<script src="popup.js"></script>
</body>
</html>
